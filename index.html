<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Private Chat Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #e5ddd5; font-family: sans-serif; overflow: hidden; margin: 0; padding: 0; width: 100vw; }
        #msgList::-webkit-scrollbar { width: 4px; }
        #msgList::-webkit-scrollbar-thumb { background: #bababa; border-radius: 10px; }
        #chatApp, #presencePage, #gifModal, #emojiModal { display: none; }
        .gif-grid, .emoji-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 50vh; overflow-y: auto; padding: 10px; }
        .emoji-grid { grid-template-columns: repeat(6, 1fr); font-size: 1.8rem; }
        .gif-item { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; cursor: pointer; background: #eee; }
        .emoji-item { cursor: pointer; text-align: center; padding: 5px; }
        
        /* Audio Player Styling for S23 Ultra */
        .audio-container { width: 100%; min-width: 200px; padding: 5px 0; }
        audio { height: 40px; width: 100%; filter: sepia(20%) saturate(70%) grayscale(100%) contrast(90%) invert(10%); }
        
        * { box-sizing: border-box; }
    </style>
</head>
<body class="h-screen flex flex-col max-w-md mx-auto bg-gray-100 border-x shadow-2xl overflow-hidden">

    <!-- PASSWORD LOCK -->
    <div id="lockScreen" class="fixed inset-0 z-[100] bg-[#075e54] flex flex-col items-center justify-center p-6 text-white text-center">
        <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner font-bold italic text-white">Chat</div>
        <h2 class="text-2xl font-bold mb-2">Secure Entry</h2>
        <input type="password" id="passInput" placeholder="Password" class="w-full max-w-xs bg-white/10 border border-white/30 rounded-lg px-4 py-3 outline-none mb-4 text-center text-xl text-white">
        <button onclick="checkPassword()" class="w-full max-w-xs bg-[#128c7e] py-3 rounded-lg font-bold shadow-lg">Unlock Chat</button>
        <p id="errorMsg" class="text-red-300 mt-4 text-sm hidden font-bold">Incorrect password.</p>
    </div>

    <!-- GIF MODAL -->
    <div id="gifModal" class="fixed inset-0 z-[90] bg-black/90 p-4 flex flex-col">
        <div class="bg-white rounded-t-xl p-4 flex gap-2">
            <input type="text" id="gifSearchInput" placeholder="Search GIPHY..." class="flex-1 border rounded-full px-4 py-2 outline-none text-black bg-gray-100">
            <button onclick="toggleGifModal()" class="text-gray-500 font-bold px-2">✕</button>
        </div>
        <div id="gifResults" class="bg-white rounded-b-xl p-2 gif-grid flex-1"></div>
    </div>

    <!-- EMOJI MODAL -->
    <div id="emojiModal" class="fixed inset-0 z-[95] bg-black/80 p-6 flex flex-col justify-center">
        <div class="bg-white rounded-xl p-2 shadow-2xl">
            <div class="flex justify-between p-2 border-b mb-2">
                <span class="font-bold text-gray-400 uppercase text-[10px]">Select Emoji</span>
                <button onclick="toggleEmojiPicker()" class="text-gray-400">✕</button>
            </div>
            <div id="emojiGrid" class="emoji-grid"></div>
        </div>
    </div>

    <!-- CHAT APP -->
    <div id="chatApp" class="h-screen flex flex-col w-full overflow-hidden">
        <header class="bg-[#075e54] text-white p-4 pb-3 flex items-center gap-3 shadow-md pt-12 relative z-20">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold italic">C</div>
            <div class="flex-1 cursor-pointer" onclick="togglePresence()">
                <h1 class="font-bold text-sm">Private Chat</h1>
                <p id="onlineCount" class="text-[9px] opacity-80 uppercase font-mono tracking-tighter italic">Connecting...</p>
            </div>
            <button onclick="wipeAndLogout()" class="bg-red-600/20 border border-red-400 text-[9px] px-2 py-1 rounded font-bold uppercase">Wipe</button>
        </header>

        <div id="presencePage" class="absolute top-[100px] left-0 w-full bg-white shadow-2xl z-[70] p-4 border-b">
            <ul id="userList" class="text-sm space-y-1 text-gray-800 font-medium text-center"></ul>
        </div>

        <!-- ADDED px-6 TO PREVENT EDGE CUTOFF -->
        <div id="msgList" class="flex-1 overflow-y-auto px-6 py-4 space-y-6 pb-32 bg-[#e5ddd5]"></div>

        <!-- INPUT BAR -->
        <div class="w-full bg-[#f0f0f0] border-t pt-3 px-4 pb-28 flex items-center gap-2 shadow-inner relative z-50">
            <button onclick="toggleGifModal()" class="flex-shrink-0 p-2 bg-gray-300 rounded-lg text-[10px] font-black text-gray-700">GIF</button>
            <button onclick="document.getElementById('fileInput').click()" id="clipBtn" class="flex-shrink-0 p-2 hover:bg-gray-200 rounded-full text-xl">📎</button>
            <input type="file" id="fileInput" class="hidden" onchange="uploadAnyFile(this.files[0])">
            
            <div class="flex-1 flex items-center bg-white rounded-full border border-gray-300 px-3 py-1 min-w-0">
                <input type="text" id="msgInput" placeholder="Message" class="flex-1 outline-none text-base py-1 min-w-0 bg-transparent">
                <button onclick="toggleEmojiPicker()" class="p-1 text-xl flex-shrink-0">😀</button>
            </div>

            <button id="micBtn" onclick="handleMic()" class="flex-shrink-0 bg-[#128c7e] text-white w-10 h-10 flex items-center justify-center rounded-full shadow-md">🎤</button>
            <button onclick="sendText()" class="flex-shrink-0 bg-[#128c7e] text-white w-10 h-10 flex items-center justify-center rounded-full shadow-md active:scale-95">
                <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const SECRET = "durango";
        const SB_URL = "https://cjyqfygudiuijmtzzzbh.supabase.co";
        const SB_KEY = "sb_publishable_Iz5aJ-uoiMSd1c1fx6rwWA_Nb4p0RiZ";
        const GIPHY_KEY = "NJOdOy12XPRPjco9lLazfpG6MHE3CwnG"; // Get this from GIPHY dashboard
        
        const _supabase = supabase.createClient(SB_URL, SB_KEY);
        const msgList = document.getElementById('msgList');
        const msgInput = document.getElementById('msgInput');
        const micBtn = document.getElementById('micBtn');
        let user = localStorage.getItem('chat_user') || "";

        // EMOJI GRID
        const emojiList = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👿','👹','👺','🤡','👻','💀','☠️','👽','👾','🤖','💩'];
        const emojiGrid = document.getElementById('emojiGrid');
        emojiList.forEach(e => {
            const span = document.createElement('span');
            span.className = 'emoji-item';
            span.innerText = e;
            span.onclick = () => { msgInput.value += e; toggleEmojiPicker(); msgInput.focus(); };
            emojiGrid.appendChild(span);
        });
        function toggleEmojiPicker() { 
            const em = document.getElementById('emojiModal');
            em.style.display = (em.style.display === 'flex') ? 'none' : 'flex'; 
        }

        // GIPHY
        function toggleGifModal() { 
            const gm = document.getElementById('gifModal');
            gm.style.display = (gm.style.display === 'flex') ? 'none' : 'flex'; 
            if(gm.style.display === 'flex') searchGifs('trending');
        }
        async function searchGifs(term) {
            const resultsDiv = document.getElementById('gifResults');
            try {
                const endpoint = term === 'trending' ? 'trending' : 'search';
                const res = await fetch(`https://api.giphy.com/v1/gifs/${endpoint}?api_key=${GIPHY_KEY}&q=${term}&limit=12&rating=g`);
                const data = await res.json();
                resultsDiv.innerHTML = data.data.map(g => `<img src="${g.images.fixed_height_small.url}" class="gif-item" onclick="sendGif('${g.images.fixed_height.url}')">`).join('');
            } catch (err) { resultsDiv.innerHTML = 'Error'; }
        }
        document.getElementById('gifSearchInput').oninput = (e) => {
            clearTimeout(window.gtimer);
            window.gtimer = setTimeout(() => searchGifs(e.target.value || 'trending'), 500);
        };
        async function sendGif(url) {
            await _supabase.from('messages').insert([{ user, type: 'image', url }]);
            toggleGifModal();
        }

        // UPLOADS
        async function uploadAnyFile(file, forcedType = null) {
            if(!file || !user) return;
            const clipBtn = document.getElementById('clipBtn');
            clipBtn.innerHTML = '⏳';
            const fileName = `${Date.now()}_file`;
            const { error } = await _supabase.storage.from('uploads').upload(fileName, file);
            if (error) { alert(error.message); clipBtn.innerHTML = '📎'; return; }
            const { data } = _supabase.storage.from('uploads').getPublicUrl(fileName);
            let type = forcedType || (file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : file.type.startsWith('audio/') ? 'audio' : 'file');
            await _supabase.from('messages').insert([{ user, type, url: data.publicUrl }]);
            clipBtn.innerHTML = '📎';
        }

        let mediaRecorder;
        let audioChunks = [];
        async function handleMic() {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        uploadAnyFile(new Blob(audioChunks, { type: 'audio/mp3' }), 'audio');
                        micBtn.classList.remove('bg-red-500', 'animate-pulse');
                    };
                    mediaRecorder.start();
                    micBtn.classList.add('bg-red-500', 'animate-pulse');
                } catch(e) { alert("Mic Permission Denied."); }
            } else { mediaRecorder.stop(); }
        }

        async function sendText() {
            const val = msgInput.value.trim();
            if(!val || !user) return;
            msgInput.value = '';
            await _supabase.from('messages').insert([{ user, text: val, type: 'text' }]);
        }

        function checkPassword() {
            if (document.getElementById('passInput').value === SECRET) {
                localStorage.setItem('chat_unlocked', 'true');
                startApp();
            } else { document.getElementById('errorMsg').classList.remove('hidden'); }
        }

        function startApp() {
            if(!user) {
                user = prompt("Select Username:");
                if(!user) user = "User" + Math.floor(Math.random() * 100);
                localStorage.setItem('chat_user', user);
            }
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('chatApp').style.display = 'flex';
            loadHistory();
            initPresence();
        }

        function initPresence() {
            const channel = _supabase.channel('room1', { config: { presence: { key: user } } });
            channel.on('presence', { event: 'sync' }, () => {
                const state = channel.presenceState();
                document.getElementById('onlineCount').innerText = `${Object.keys(state).length} ONLINE NOW`;
                document.getElementById('userList').innerHTML = Object.keys(state).map(u => `<li>🟢 ${u}</li>`).join('');
            }).subscribe(async (s) => { if (s === 'SUBSCRIBED') await channel.track({ online_at: new Date().toISOString() }); });
        }

        // FIXED RENDERER FOR S23 ULTRA
        function renderMessage(data) {
            const isMe = data.user === user;
            const wrapper = document.createElement('div');
            // Using max-w-[85%] ensures the bubble can never span the whole width and get cut off
            wrapper.className = `flex w-full mb-2 ${isMe ? 'justify-end' : 'justify-start'}`;
            
            let innerContent = `<p class="text-sm">${data.text || ''}</p>`;
            if (data.type === 'image') innerContent = `<img src="${data.url}" class="rounded-lg max-w-full mt-1 border shadow-sm" onclick="window.open('${data.url}')">`;
            if (data.type === 'video') innerContent = `<video src="${data.url}" controls class="rounded-lg max-w-full mt-1"></video>`;
            if (data.type === 'audio') {
                innerContent = `
                    <div class="audio-container">
                        <div class="text-[10px] opacity-50 mb-1 flex items-center">🔊 Voice Message</div>
                        <audio src="${data.url}" controls></audio>
                    </div>
                `;
            }
            if (data.type === 'file') innerContent = `<a href="${data.url}" target="_blank" class="text-blue-600 font-bold underline py-2 block text-xs">📎 Download File</a>`;

            wrapper.innerHTML = `
                <div class="max-w-[85%] px-4 py-2 rounded-2xl shadow-sm ${isMe ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white text-gray-800 rounded-tl-none'}">
                    <div class="text-[10px] font-bold uppercase opacity-60 mb-1">${data.user}</div>
                    ${innerContent}
                </div>
            `;
            msgList.appendChild(wrapper);
            msgList.scrollTop = msgList.scrollHeight;
        }

        async function loadHistory() {
            const { data } = await _supabase.from('messages').select('*').order('id', { ascending: true });
            if(data) { msgList.innerHTML = ''; data.forEach(renderMessage); }
            msgList.scrollTop = msgList.scrollHeight;
        }

        _supabase.channel('messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => renderMessage(p.new))
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, () => { 
            msgList.innerHTML = '<p class="text-center text-gray-400 text-xs mt-10 italic">Chat history wiped by a user.</p>'; 
        }).subscribe();

        function wipeAndLogout() { if(confirm("Wipe all?")){ _supabase.from('messages').delete().neq('id',0).then(()=>{ localStorage.clear(); window.location.reload(); }); } }
        function togglePresence() { const p = document.getElementById('presencePage'); p.style.display = (p.style.display === 'block') ? 'none' : 'block'; }
        
        window.onload = () => { if (localStorage.getItem('chat_unlocked') === 'true') startApp(); };
        msgInput.onkeydown = (e) => { if(e.key === "Enter") sendText(); };
        document.getElementById('passInput').onkeydown = (e) => { if(e.key === "Enter") checkPassword(); };
    </script>
</body>
</html>
